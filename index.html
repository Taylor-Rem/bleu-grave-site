<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bleu Grave — post-punk from Newport Beach, California</title>
  <meta name="description" content="Bleu Grave is a post-punk band from Newport Beach, California. Music, shows, and merch.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
  <!-- The ?v= is a cache-buster. Phones were holding an old copy of the
       stylesheet for ten minutes after a change and the band kept seeing
       things they had already asked to have fixed. Bump the number in all
       five pages whenever a colour or layout change has to land now. -->
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

  <header class="site-header">
    <a class="wordmark" href="index.html"><img src="images/logo.jpg" width="1200" height="1088" alt="Bleu Grave"></a>
    <nav class="site-nav" aria-label="Site">
      <a href="index.html" aria-current="page">About</a>
      <a href="music.html">Music</a>
      <a href="photos.html">Photos</a>
      <a href="merch.html">Merch</a>
      <a href="events.html">Shows</a>
    </nav>
  </header>

  <main>
    <!-- The top of the page is the photo and nothing else. The panel that
         used to sit beside it — the big BLEU GRAVE title, the code strip and
         the "Post-punk · Newport Beach, CA" line — came off on 2026-09-15 at
         Smith's request. The heading below is there for search engines and
         screen readers only; the band's name is in the logo up in the header.
         To bring the panel back, re-add a <div class="hero-panel"> after the
         photo and drop the "hero-photo-only" class. -->
    <section class="hero hero-photo-only">
      <h1 class="visually-hidden">Bleu Grave</h1>
      <div class="hero-photo">
        <!-- Front page slideshow. Each photo is one <li>; to add one, copy a
             whole <li>…</li>, put the file in images/ and change the src and
             alt (see CLAUDE.md, "How to add a photo"). They show in the order
             they appear here, five seconds each. The stylesheet forces every
             photo to black and white, so send any photo. -->
        <div class="hero-art">
          <ul class="slideshow">
            <li>
              <img src="images/band-live-01.jpg" width="1200" height="960"
                   alt="Bleu Grave on stage: two guitarists, the singer at the mic and the drummer behind a kick drum with the band name on it.">
            </li>
            <li>
              <img src="images/band-01.jpg" width="722" height="722"
                   alt="The four members of Bleu Grave in black coats, standing in snow.">
            </li>
          </ul>
        </div>
        <!-- The scrawled tagline that sat across the bottom of this photo was
             a placeholder ("Loud rooms, cold hymns."); Smith asked for it off
             on 2026-09-15. If the band ever sends their own line, put it back
             as <p class="hero-tagline">…</p> right here — the style for it is
             still in the stylesheet. -->
      </div>
    </section>

    <!-- The About block that used to sit here — the "Bleu Grave" heading, the
         band's four-paragraph bio and the two buttons — came off on
         2026-09-15. Smith asked for it twice ("get rid of the whole block…
         it's the second block on the first page"), so the front page is the
         photo and nothing else. The bio is his own text and he may want it
         back on another page: it is in this file's history, in the commit
         "Put the band's own bio on the home page". Don't rewrite it from
         memory — take it from there. -->
  </main>

  <footer class="site-footer">
    <div class="code code-thin" role="img" aria-label="Bleu Grave, spelled in the site's code strip">
      <span style="--i:1"></span><span style="--i:11"></span><span style="--i:4"></span><span style="--i:20"></span><span class="gap"></span><span style="--i:6"></span><span style="--i:17"></span><span style="--i:0"></span><span style="--i:21"></span><span style="--i:4"></span>
    </div>
    <ul class="footer-links">
      <li><a href="https://instagram.com/bleugrave">Instagram</a></li>
      <!-- REPLACE-ME: set the real Bandcamp URL once the page is confirmed. -->
      <li><a href="https://bleugrave.bandcamp.com">Bandcamp</a></li>
    </ul>
    <!-- REPLACE-ME: mailing list. When the band picks a list provider
         (e.g. Buttondown, Mailchimp), swap this line for their signup form
         embed. No home-built form — the provider hosts it. -->
    <p class="mailing-list">Mailing list coming soon — for now, follow
    <a href="https://instagram.com/bleugrave">@bleugrave</a> for show news.</p>
    <p class="copyright">&copy; 2026 Bleu Grave</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
