<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos — Bleu Grave</title>
  <meta name="description" content="Photos of Bleu Grave, a post-punk band from Newport Beach, California.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a class="wordmark" href="index.html">Bleu Grave</a>
    <nav class="site-nav" aria-label="Site">
      <a href="index.html">About</a>
      <a href="music.html">Music</a>
      <a href="photos.html" aria-current="page">Photos</a>
      <a href="merch.html">Merch</a>
      <a href="events.html">Shows</a>
    </nav>
  </header>

  <main>
    <section class="hero page-hero">
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="orb-p" cx="30%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#123a5e"/>
              <stop offset="100%" stop-color="#0a0c0e"/>
            </radialGradient>
          </defs>
          <rect width="1200" height="500" fill="url(#orb-p)"/>
          <!-- film-strip frames -->
          <g fill="none" stroke="#6fc2ff" stroke-width="1.5">
            <rect x="80"  y="150" width="200" height="200" stroke-opacity="0.22"/>
            <rect x="340" y="150" width="200" height="200" stroke-opacity="0.16"/>
            <rect x="600" y="150" width="200" height="200" stroke-opacity="0.12"/>
            <rect x="860" y="150" width="200" height="200" stroke-opacity="0.08"/>
          </g>
        </svg>
      </div>
      <div class="hero-inner">
        <h1 class="hero-title">Photos</h1>
      </div>
    </section>

    <section class="section">
      <div class="section-inner reveal">
        <p class="kicker">Gallery</p>
        <h2>The Band</h2>

        <!-- Each photo is one <li>. To add one, copy a whole <li>…</li>
             block, put the image file in images/, and change the src and
             alt. See CLAUDE.md, "How to add a photo". -->
        <ul class="photo-grid">
          <li>
            <a href="images/band-01.jpg">
              <img src="images/band-01.jpg" width="722" height="722" loading="lazy"
                   alt="The four members of Bleu Grave in black coats, standing in snow.">
            </a>
          </li>
          <li>
            <a href="images/band-02.jpg">
              <img src="images/band-02.jpg" width="640" height="640" loading="lazy"
                   alt="Two members of Bleu Grave in sunglasses, standing in front of a graphic of two eyes, under the band name in block letters.">
            </a>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <ul class="footer-links">
      <li><a href="https://instagram.com/bleugrave">Instagram</a></li>
      <!-- REPLACE-ME: set the real Bandcamp URL once the page is confirmed. -->
      <li><a href="https://bleugrave.bandcamp.com">Bandcamp</a></li>
    </ul>
    <!-- REPLACE-ME: mailing list — swap for the chosen provider's signup
         form embed (same note as on index.html). -->
    <p class="mailing-list">Mailing list coming soon — for now, follow
    <a href="https://instagram.com/bleugrave">@bleugrave</a> for show news.</p>
    <p class="copyright">&copy; 2026 Bleu Grave</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
