<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos — Bleu Grave</title>
  <meta name="description" content="Photos of Bleu Grave, a post-punk band from Newport Beach, California.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="canonical" href="https://bleugraveband.com/photos">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a class="wordmark" href="index.html"><img src="images/logo.jpg" width="1200" height="1088" alt="Bleu Grave"></a>
    <nav class="site-nav" aria-label="Site">
      <a href="index.html">News</a>
      <a href="events.html">Tour</a>
      <a href="merch.html">Store</a>
      <a href="music.html">Music</a>
      <a href="video.html">Video</a>
      <a href="#signup">Sign Up</a>
    </nav>
  </header>

  <main>
    <section class="hero page-hero page-hero-bare">
      <div class="hero-panel">
        <h1 class="hero-title">Photos</h1>
      </div>
    </section>

    <section class="section">
      <div class="section-inner reveal">
        <!-- The blue scrawled "Gallery" label came off 2026-09-16 with the
             rest of the cursive labels, at Smith's request. -->
        <h2>The Band</h2>

        <!-- Each photo is one <li>. To add one, copy the commented block
             below into the list, put the image file in images/, and change
             the src and alt. See CLAUDE.md, "How to add a photo".

             <li>
               <a href="images/band-03.jpg">
                 <img src="images/band-03.jpg" width="1200" height="1200" loading="lazy"
                      alt="Say who is in the photo and where.">
               </a>
             </li>

             The gallery is empty because Smith had the last photo taken off
             on 2026-09-15. Delete the "coming soon" line below as soon as
             there is a photo in the list. -->
        <ul class="photo-grid"></ul>

        <p class="muted">Photos coming soon.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <ul class="footer-links">
      <li><a href="https://instagram.com/bleugrave">Instagram</a></li>
      <!-- REPLACE-ME: set the real Bandcamp URL once the page is confirmed. -->
      <li><a href="https://bleugrave.bandcamp.com">Bandcamp</a></li>
    </ul>
    <!-- Newsletter sign-up (Patchlamp). Posts to patchlamp.com, which keeps the
         list; nothing is stored on this site. The `website` field is a honeypot —
         leave it hidden and empty. After a sign-up the page reloads with
         ?subscribed=1#signup and the thanks line shows; with JavaScript off the
         box still works, the thanks line just doesn't appear. -->
    <form class="signup" id="signup" action="https://patchlamp.com/f/bleu-grave/newsletter" method="post">
      <label for="signup-email">Get shows, releases and news by email</label>
      <div class="signup-row">
        <input id="signup-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
        <button type="submit">Sign up</button>
      </div>
      <input name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
      <p class="signup-thanks" hidden>You're on the list. Check your inbox.</p>
      <script>
        (function () {
          if (location.search.indexOf("subscribed=1") !== -1) {
            var f = document.getElementById("signup");
            f.querySelector(".signup-thanks").hidden = false;
            f.querySelector(".signup-row").hidden = true;
            f.querySelector("label").hidden = true;
          }
        })();
      </script>
    </form>
    <p class="mailing-list">Follow
    <a href="https://instagram.com/bleugrave">@bleugrave</a></p>
    <p class="copyright">&copy; 2026 Bleu Grave</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
