<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tour — Bleu Grave</title>
  <meta name="description" content="Bleu Grave shows — next dates and past tours.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=24">
</head>
<body>

  <header class="site-header">
    <a class="wordmark" href="index.html"><img src="images/logo.jpg" width="1200" height="1088" alt="Bleu Grave"></a>
    <nav class="site-nav" aria-label="Site">
      <a href="index.html">News</a>
      <a href="events.html" aria-current="page">Tour</a>
      <a href="merch.html">Store</a>
      <a href="music.html">Music</a>
      <a href="video.html">Video</a>
      <a href="#signup">Sign Up</a>
    </nav>
  </header>

  <main>
    <!-- The big "Tour" title that used to sit here (scrawled hand font,
         Smith asked for that look 2026-09-15) came off on 2026-09-16 — he
         asked for it gone. The heading below is kept for search engines and
         screen readers only; the page starts straight into Past Shows now.
         To bring the visible title back, restore a
         <section class="hero page-hero page-hero-bare"><div class="hero-panel">
         <h1 class="hero-title hero-title-hand">Tour</h1></div></section>
         in its place. -->
    <h1 class="visually-hidden">Tour</h1>

    <!-- This whole page is rendered by js/main.js from events.json — to
         add, change, or cancel a show, edit that file (see CLAUDE.md).
         The sections below start hidden; the script un-hides whichever
         ones have shows in them. -->

    <!-- Next Shows came off on 2026-09-16 ("just the upcoming") and went back
         on the same day: his next message asked for details to be changed on
         one of these shows, which only makes sense with the list on the page.
         He was most likely asking for the old "Upcoming" label above this
         heading, which had already been removed. If he asks again, take this
         whole section out — the shows stay in events.json either way and the
         script skips the section when it isn't there. -->
    <section class="section" id="upcoming-shows" hidden>
      <div class="section-inner">
        <h2>Next Shows</h2>
        <ul class="event-list"></ul>
      </div>
    </section>

    <!-- There used to be a "no shows listed right now, follow @bleugrave"
         block here (id="no-shows"). Smith asked for everything off this page
         on 2026-09-15, so the page is the title alone until there are real
         shows. The script only touches that block if it exists, so nothing
         breaks by its absence — add a show to events.json and the Next Shows
         list below un-hides itself and fills in. To bring the placeholder
         back, re-add a section with that id. -->

    <!-- The Past Shows archive (id="past-shows") is off the page as of
         2026-09-15 — Smith asked for everything off this page, and the old
         dates were all that was rendering. The shows themselves are still in
         events.json, nothing was deleted: re-add a section with that id and
         an empty .event-list and the archive fills itself in again. The
         script skips the section when it isn't there. -->

    <!-- Not the JS-driven archive above — Smith asked for a plain "Past
         Shows" heading with a tour flyer under it (2026-09-15). Add more
         flyers the same way: copy the img line, drop the file in images/. -->
    <section class="section">
      <div class="section-inner reveal">
        <h2>Past Shows</h2>
        <img class="section-photo" src="images/poster-balduman-bears-tour.jpg" width="518" height="800" loading="lazy" alt="Tour poster for Balduman Bears with Bleu Grave: Provo UT 7/17, Seattle WA 7/23, Portland OR 7/24, San Francisco CA 7/25, Long Beach CA 7/27, Phoenix AZ 7/28, Las Vegas NV 7/29.">
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <ul class="footer-links">
      <li><a href="https://instagram.com/bleugrave">Instagram</a></li>
      <!-- REPLACE-ME: set the real Bandcamp URL once the page is confirmed. -->
      <li><a href="https://bleugrave.bandcamp.com">Bandcamp</a></li>
    </ul>
    <!-- REPLACE-ME: mailing list — swap for the chosen provider's signup
         form embed (same note as on index.html). -->
    <p class="mailing-list" id="signup">Mailing list coming soon — for now, follow
    <a href="https://instagram.com/bleugrave">@bleugrave</a> for show news.</p>
    <p class="copyright">&copy; 2026 Bleu Grave</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
