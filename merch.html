  <!-- Freshness check. GitHub Pages serves every page with max-age=600, so a
       phone can keep showing a copy for ten minutes after a change is live —
       which is why the band kept re-reporting things that were already fixed.
       This asks the server what the current build is (a unique query, so no
       cache can answer it from memory) and reloads once if this copy is old.
       tools/stamp rewrites BUILD; don't edit it by hand. -->
  <script>
  (function () {
    var BUILD = "20260916-031038";
    var KEY = "bg-freshness-reload";
    function check() {
      fetch("/version.json?_=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (v) {
          if (!v || !v.build || v.build === BUILD) return;
          try {
            // One reload per build, so a bad deploy can never loop the page.
            if (sessionStorage.getItem(KEY) === v.build) return;
            sessionStorage.setItem(KEY, v.build);
          } catch (e) { return; }
          location.replace(location.pathname + "?b=" + v.build + location.hash);
        })
        .catch(function () {});
    }
    check();
    // Coming back to a backgrounded tab restores it from memory without
    // re-running the page, which is exactly how Smith was seeing old copies.
    window.addEventListener("pageshow", function (e) { if (e.persisted) check(); });
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) check();
    });
  })();
  </script>
